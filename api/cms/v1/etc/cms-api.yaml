Name: cms-api
Host: 0.0.0.0
Port: 8888
# 全局请求体上限（字节）。需大于 Upload.MaxSizeMB（默认 5MB），否则大文件在到达业务层大小校验前
# 就被 go-zero 以 413 拒绝。这里取 8MB 作为上限，超 5MB 的合法请求由业务层返回友好的 4001。
MaxBytes: 8388608

# 单请求处理上限（毫秒）。go-zero 默认 3000ms 并给请求 ctx 加 deadline；管理端批量写、
# 角色权限/用户角色覆盖式分配等事务包含多条串行 SQL，3 秒过紧。写事务使用独立的
# transactionTimeout（10s，见 logic/txcontext.go），这里放宽到 15s，保证事务能在请求
# 生命周期内完成并返回明确结果，而不是客户端先超时、事务随后才提交。
Timeout: 15000

# 允许跨域访问的前端源（前端独立域名部署时配置）。含 "*" 表示允许任意源（仅适合无 cookie 凭据、纯 token 鉴权场景）。
# 本地开发用 Vite(5173) 联调时，需把对应源加入列表，否则浏览器拦截 OPTIONS 预检。
Cors:
  - "http://localhost:5173"
  - "http://127.0.0.1:5173"

Database:
  Driver: "mysql"
  Source: "root:123456@tcp(127.0.0.1:3306)/go_meteor_cms?parseTime=True&loc=Local"

Auth:
  AccessSecret: "8x!A%D*G-KaPdSgVkYp3s6v9y$B?E(H+MbQeThWmZq4t7w!z%C*F-J@NcRfUjXn2"   # 用于签发 Token
  AccessExpire: 86400             # Token 有效期，单位秒
  RefreshSecret: "rEfReSh-6KpVq2Jx!YmN3sLz8Wb@TcE5HgU7DfA1"   # 刷新令牌专用密钥，与 AccessSecret 区分
  RefreshExpire: 604800          # 刷新令牌有效期，单位秒（默认 7 天）
  RefreshGraceSeconds: 5         # 刷新令牌轮换后的并发宽限期（秒），避免并发请求误登出

Login:
  MaxFailCount: 5                 # 连续登录失败达到该次数后锁定账号
  LockMinutes: 15                 # 锁定持续时间（分钟）
  CaptchaEnabled: true            # 是否强制登录验证码；仅本地开发 / 自动化 E2E 可设为 false
  RateLimit:                     # 登录接口按客户端 IP 固定窗口限流（防爆破）
    Enabled: true                # 是否启用，默认关闭
    Max: 10                      # 窗口内允许的最大尝试次数
    Window: 60                   # 统计窗口（秒）
    BlockSeconds: 300            # 触发限流后拒绝时长（秒）

Public:
  RateLimit:                     # 免鉴权 /api/ 接口按客户端 IP 限流（防刷）
    Enabled: true                # 是否启用
    Max: 60                      # 窗口内允许的最大请求数
    Window: 60                   # 统计窗口（秒）
    BlockSeconds: 60             # 触发限流后拒绝时长（秒）

# 登录限流与公开接口限流的分布式存储。Host 为空时，登录限流自动降级为单实例内存模式（重启即清空、多实例不共享）。
# 多实例 / 容器化部署务必配置，否则各实例独立计数、限流形同虚设。
Redis:
  Host: "127.0.0.1:6379"
  Type: "node"
  Pass: ""
  DB: 0

# 前端站点地址，用于拼接找回密码等邮件中的跳转链接；留空则仅下发裸令牌
WebBaseURL: ""

Maintenance:
  TokenBlacklistCleanInterval: 3600   # 过期 token 黑名单清理间隔（秒），<=0 时按 3600 处理

Upload:
  Dir: "public/uploads"                 # 文件保存根目录
  MaxSizeMB: 5                          # 单个文件大小上限（MB）
  AllowedExts:                          # 允许的扩展名白名单
    - ".jpg"
    - ".jpeg"
    - ".png"
    - ".gif"
    - ".webp"

Mail:
  Enabled: false                  # false 时邮件只输出到日志，不发真实邮件
  Host: "smtp.example.com"        # SMTP 服务器
  Port: 587                       # 常用端口：587(STARTTLS) / 465(SSL) / 25
  Username: "noreply@example.com" # 登录账号
  Password: ""                    # 登录密码或授权码
  From: "Go Meteor CMS <noreply@example.com>"
