# 全栈一键编排：MySQL + Redis + 迁移 + API（前端打包进 API 镜像，由 Go 服务统一托管）。
#
# 启动： docker compose up -d
#   依赖顺序由 depends_on 保证：
#     mysql 就绪(健康检查通过) → migrate 执行表结构+种子(幂等) → api 启动并托管前端 SPA(:${API_PORT})
# 停止（保留数据）： docker compose down
# 停止（清空数据）： docker compose down -v
#
# 配置集中在 .env（开发默认值见 .env.example）：
#   - 改密码/库名：改 MYSQL_ROOT_PASSWORD / MYSQL_DATABASE，并同步改 MYSQL_DSN 中对应部分
#   - 容器内服务间连接（MYSQL_DSN 的 mysql:3306、REDIS_HOST 的 redis:6379）使用 compose 服务名，一般无需改
#   - 各服务端口（API_PORT / REDIS_PORT）可改；MYSQL 默认不映射宿主机端口以免与本地 MySQL(3306) 冲突，
#     如需从宿主机直连，取消下方 mysql.ports 注释并设 MYSQL_PORT 对应值（如 3307）
#
# 未提供 .env 时，下方 ${VAR:-默认值} 自动生效，开箱即用。

services:
  mysql:
    image: mysql:8.0
    container_name: go-meteor-cms-mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-go_meteor_cms}
    # ports:
    #   - "${MYSQL_PORT:-3306}:3306"   # 取消注释可从宿主机访问；若本地已占 3306 请改用 3307
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${MYSQL_ROOT_PASSWORD:-123456}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: go-meteor-cms-redis
    command: ["redis-server", "--appendonly", "no"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # 迁移：基于同一镜像，仅替换启动命令为 /app/migrate；依赖 mysql 健康后执行（幂等）
  migrate:
    image: ${CMS_IMAGE:-go-meteor-cms:local}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org/}
        GOPROXY: ${GOPROXY:-https://proxy.golang.org,direct}
    container_name: go-meteor-cms-migrate
    command: ["/app/migrate"]
    environment:
      MYSQL_DSN: ${MYSQL_DSN:-root:123456@tcp(mysql:3306)/go_meteor_cms?parseTime=True&loc=Local}
    depends_on:
      mysql:
        condition: service_healthy
    restart: "no"

  # API：同一镜像默认 CMD 为 /app/cms -f etc/cms-api.yaml；前端由 WEB_DIST 托管
  api:
    image: ${CMS_IMAGE:-go-meteor-cms:local}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org/}
        GOPROXY: ${GOPROXY:-https://proxy.golang.org,direct}
    container_name: go-meteor-cms-api
    ports:
      - "${API_PORT:-8888}:8888"
    environment:
      MYSQL_DSN: ${MYSQL_DSN:-root:123456@tcp(mysql:3306)/go_meteor_cms?parseTime=True&loc=Local}
      REDIS_HOST: ${REDIS_HOST:-redis:6379}
      WEB_DIST: ${WEB_DIST:-/app/web/dist}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  mysql_data:
