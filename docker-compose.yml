# 全栈一键编排：MySQL + Redis + 迁移 + API（前端打包进 API 镜像，由 Go 服务统一托管）。
#
# 启动： docker compose up -d
#   依赖顺序由 depends_on 保证：
#     mysql 就绪(健康检查通过) → migrate 执行表结构+种子(幂等) → api 启动并托管前端 SPA(8888)
# 停止（保留数据）： docker compose down
# 停止（清空数据）： docker compose down -v
#
# 仅要依赖、应用仍在宿主机跑： docker compose up -d mysql redis
#   （此时若宿主机已占用 3306，请把下方 mysql.ports 改映射到其它宿主机端口，并同步改 cms-api.yaml）
#
# 容器内通过环境变量注入连接信息，无需改动 cms-api.yaml：
#   MYSQL_DSN   指向 mysql:3306 ； REDIS_HOST 指向 redis:6379 ； WEB_DIST=/app/web/dist
# 改 root 密码 / 库名时，同步修改 mysql.environment 与下方 MYSQL_DSN 两处即可。
#
# 说明：mysql / redis 未映射宿主机端口（纯内部网络），以免与本地已运行的 MySQL(3306) 冲突；
#       如需从宿主机用 GUI/redis-cli 直连，取消对应 ports 注释即可（注意 3306 端口冲突）。

services:
  mysql:
    image: mysql:8.0
    container_name: go-meteor-cms-mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: "123456"
      MYSQL_DATABASE: "go_meteor_cms"
    # ports:
    #   - "3306:3306"   # 取消注释可从宿主机访问；若本地 MySQL 已占 3306 请改用 "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p123456"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: go-meteor-cms-redis
    command: ["redis-server", "--appendonly", "no"]
    ports:
      - "6379:6379"   # 当前宿主机无 Redis，映射无冲突；如需独占可删掉此行
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # 迁移：基于同一镜像，仅替换启动命令为 /app/migrate；依赖 mysql 健康后执行（幂等）
  migrate:
    image: go-meteor-cms:local
    build:
      context: .
      dockerfile: Dockerfile
    container_name: go-meteor-cms-migrate
    command: ["/app/migrate"]
    environment:
      MYSQL_DSN: "root:123456@tcp(mysql:3306)/go_meteor_cms?parseTime=True&loc=Local"
    depends_on:
      mysql:
        condition: service_healthy
    restart: "no"

  # API：同一镜像默认 CMD 为 /app/cms -f etc/cms-api.yaml；前端由 WEB_DIST 托管
  api:
    image: go-meteor-cms:local
    build:
      context: .
      dockerfile: Dockerfile
    container_name: go-meteor-cms-api
    ports:
      - "8888:8888"
    environment:
      MYSQL_DSN: "root:123456@tcp(mysql:3306)/go_meteor_cms?parseTime=True&loc=Local"
      REDIS_HOST: "redis:6379"
      WEB_DIST: "/app/web/dist"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  mysql_data:
