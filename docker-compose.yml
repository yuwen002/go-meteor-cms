# 本地开发依赖编排（infra only）。
#
# 应用本身在宿主机用 `make run` / `go run ./api/cms/v1` 启动，连接下面暴露到宿主机的
# MySQL(127.0.0.1:3306) 与 Redis(127.0.0.1:6379)。本 compose 只负责把这两个依赖一键拉起，
# 便于在「不装本地 MySQL/Redis」的机器上跑通，或做干净的可复现环境。
#
# 说明：
#   - MySQL 默认库名 go_meteor_cms、root 密码 123456，与 api/cms/v1/etc/cms-api.yaml 的
#     Database.Source 一致。若宿主机已另有 MySQL 占用 3306，请先停掉再 `docker compose up`，
#     或把下方 ports 改成 "3307:3306" 等并同步修改 cms-api.yaml 的 Database.Source。
#   - Redis 用于：P1 登录限流（分布式）、P2-4 全局踢人/token 版本号。
#     配好后强制下线接口会真正写入 auth:tv:<id> 并吊销旧令牌（见 docs/runbook.md）。
#
# 启动： docker compose up -d
# 停止： docker compose down
# 清空数据（含库）： docker compose down -v
services:
  mysql:
    image: mysql:8.0
    container_name: go-meteor-cms-mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: "123456"
      MYSQL_DATABASE: "go_meteor_cms"
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p123456"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: go-meteor-cms-redis
    command: ["redis-server", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  mysql_data:
