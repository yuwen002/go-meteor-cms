# 本地开发依赖编排。
# 说明：
#   - 应用本身依赖 MySQL（见 api/cms/v1/etc/cms-api.yaml 的 Database.Source，
#     默认 127.0.0.1:3306）。本 compose 不内置 MySQL，请保证本机/可访问的 MySQL 已就绪。
#   - Redis 用于：P1 登录限流（分布式）、P2-4 全局踢人/token 版本号。
#     不配置 Redis 时这两项会自动降级（限流→单实例内存、踢人→不校验），防护不失效。
#
# 启动： docker compose up -d redis
# 验证踢人（P2-4）见 docs/runbook.md 对应章节。
services:
  redis:
    image: redis:7-alpine
    container_name: go-meteor-cms-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "no"]
    restart: unless-stopped
